{# Edit Ad Request — Bootstrap 5 modal, pre-filled from context. Used via {% include %} in ad_detail / request_detail. #}
<div class="modal fade" id="editAdModal" tabindex="-1" aria-labelledby="editAdModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-bottom">
        <h5 class="modal-title" id="editAdModalLabel"><i class="fa-solid fa-pen-to-square icon me-1" aria-hidden="true"></i> Edit Request</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="editAdErrors" class="alert alert-danger d-none mb-3"></div>
        <form id="editAdForm" novalidate>
          <div class="mb-3">
            <label for="editAdContent" class="form-label fw-semibold">Ad content</label>
            <textarea id="editAdContent" name="content" class="form-control" rows="5" maxlength="500">{{ ad.content|default:"" }}</textarea>
            <div class="form-text text-end"><span id="editAdContentCount">{{ ad.content|length }}</span> / 500</div>
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="editAdCategory" class="form-label fw-semibold">Category</label>
              <select id="editAdCategory" name="category" class="form-select form-control">
                <option value="">— Select —</option>
                {% for cat in categories %}
                <option value="{{ cat.pk }}"{% if ad.category_id == cat.pk %} selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label for="editAdStatus" class="form-label fw-semibold">Status</label>
              <select id="editAdStatus" name="status" class="form-select form-control">
                {% for value, label in status_choices %}
                <option value="{{ value }}"{% if ad.status == value %} selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label for="editAdPhone" class="form-label fw-semibold">Phone</label>
              <input type="text" id="editAdPhone" name="phone_number" class="form-control" value="{{ edit_phone|default:'' }}" maxlength="20" placeholder="+98 912 345 6789">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-top">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-soul px-4" id="editAdSaveBtn">
          <i class="fa-solid fa-floppy-disk icon me-1" aria-hidden="true"></i> Save Changes
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var saveBtn = document.getElementById('editAdSaveBtn');
  var errBox = document.getElementById('editAdErrors');
  var contentEl = document.getElementById('editAdContent');
  var countEl = document.getElementById('editAdContentCount');
  if (!saveBtn) return;

  if (contentEl && countEl) {
    contentEl.addEventListener('input', function() { countEl.textContent = contentEl.value.length; });
  }

  saveBtn.addEventListener('click', function() {
    saveBtn.disabled = true;
    errBox.classList.add('d-none');
    errBox.textContent = '';

    var payload = {
      content: document.getElementById('editAdContent').value,
      category: document.getElementById('editAdCategory').value || '',
      status: document.getElementById('editAdStatus').value,
      phone_number: document.getElementById('editAdPhone').value
    };

    var tok = (typeof csrfToken !== 'undefined' ? csrfToken : '') || (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || '';
    fetch('{% url "ad_request_update" ad.uuid %}', {
      method: 'POST',
      headers: { 'X-CSRFToken': tok, 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      saveBtn.disabled = false;
      if (res.ok && res.data.status === 'success') {
        if (typeof showToast === 'function') { showToast('Changes saved', 'success'); }
        var modal = bootstrap.Modal.getInstance(document.getElementById('editAdModal'));
        if (modal) modal.hide();
        setTimeout(function() { location.reload(); }, 400);
      } else {
        var errors = res.data.errors || {};
        var msgs = Object.keys(errors).map(function(k) { return k + ': ' + errors[k]; });
        errBox.textContent = msgs.join(' | ') || (res.data.message || 'Save failed');
        errBox.classList.remove('d-none');
      }
    })
    .catch(function() {
      saveBtn.disabled = false;
      errBox.textContent = 'Network error — please try again.';
      errBox.classList.remove('d-none');
    });
  });
})();
</script>
